networks:
  homeproxy:
    name: homeproxy
  toolsproxy:
    name: toolsproxy
  torrentproxy:
    name: torrentproxy
  gitproxy:
    name: gitproxy
  authnet:
    name: authnet
# help
services:
  traefik:
    image: <REDACTED_HOST>/nicholas/traefik:latest
    container_name: traefik

    command:
      - "--api=true"
      - "--api.dashboard=true"

      # EntryPoints
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.forwardedHeaders.trustedIPs=127.0.0.1/8,<REDACTED_IP>/8,<REDACTED_IP>/12,<REDACTED_IP>/16"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.websecure.forwardedHeaders.trustedIPs=127.0.0.1/8,<REDACTED_IP>/8,<REDACTED_IP>/12,<REDACTED_IP>/16"
      - "--entrypoints.ssh.address=:2222"

      # TLS + ACME (per-domain certificates, no wildcard)
      - "--certificatesresolvers.cloudflare.acme.email=${LETS_ENCRYPT_EMAIL}"
      - "--certificatesresolvers.cloudflare.acme.dnschallenge=true"
      - "--certificatesresolvers.cloudflare.acme.dnschallenge.delaybeforecheck=0"
      - "--certificatesresolvers.cloudflare.acme.dnschallenge.provider=cloudflare"
      - "--certificatesresolvers.cloudflare.acme.dnschallenge.resolvers[0]=1.1.1.1:53"
      - "--certificatesresolvers.cloudflare.acme.dnschallenge.resolvers[1]=8.8.8.8:53"
      - "--certificatesresolvers.cloudflare.acme.storage=/etc/traefik/acme.json"
      # Logging
      - "--log.level=INFO"

      # Docker provider
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.endpoint=unix:///var/run/docker.sock"

      # Allow connecting to backends with self-signed certs (Omada, etc)
      - "--serversTransport.insecureSkipVerify=true"

    environment:
      - CLOUDFLARE_EMAIL=${CLOUDFLARE_EMAIL}
      - CLOUDFLARE_DNS_API_TOKEN=${CLOUDFLARE_DNS_API_TOKEN}
      - CLOUDFLARE_ZONE_API_TOKEN=${CLOUDFLARE_ZONE_API_TOKEN}
      - CF_DNS_API_TOKEN=${CLOUDFLARE_DNS_API_TOKEN}
      - CF_ZONE_API_TOKEN=${CLOUDFLARE_ZONE_API_TOKEN}
      - LETS_ENCRYPT_EMAIL=${LETS_ENCRYPT_EMAIL}
      - DOMAIN_NAME=${DOMAIN_NAME:-<REDACTED_HOST>}
      - CERTRESOLVER=${CERTRESOLVER:-cloudflare}
      - TZ=${TZ}

    labels:
      - "traefik.enable=true"

      # Dashboard (with dedicated certificate)
      - "traefik.http.routers.dashboard.entrypoints=websecure"
      - "traefik.http.routers.dashboard.rule=Host(`<REDACTED_HOST>-traefik.${DOMAIN_NAME}`)"
      - "traefik.http.routers.dashboard.service=api@internal"
      - "traefik.http.routers.dashboard.tls.certresolver=${CERTRESOLVER:-cloudflare}"
      - "traefik.http.routers.dashboard.tls.domains[0].main=<REDACTED_HOST>-traefik.${DOMAIN_NAME}"
      - "traefik.http.routers.dashboard.middlewares=authentik@docker"

      #  Authentik ForwardAuth Middleware (GLOBAL)
      - "traefik.http.middlewares.authentik.forwardauth.address=http://authentik-server:9000/outpost.goauthentik.io/auth/traefik"
      - "traefik.http.middlewares.authentik.forwardauth.trustForwardHeader=true"
      - "traefik.http.middlewares.authentik.forwardauth.authResponseHeaders=X-authentik-username,X-authentik-groups,X-authentik-email,X-authentik-name,X-authentik-uid,Remote-User,Remote-Groups,Remote-Name,Remote-Email"

      # Vaultwarden on HAOS (UI + websocket)
      - "traefik.http.routers.vaultwarden-ha.entrypoints=websecure"
      - "traefik.http.routers.vaultwarden-ha.rule=Host(`vault.${DOMAIN_NAME}`)"
      - "traefik.http.routers.vaultwarden-ha.service=vaultwarden-ha"
      - "traefik.http.routers.vaultwarden-ha.priority=90"
      - "traefik.http.routers.vaultwarden-ha.tls.certresolver=${CERTRESOLVER:-cloudflare}"
      - "traefik.http.routers.vaultwarden-ha.tls.domains[0].main=vault.${DOMAIN_NAME}"
      - "traefik.http.services.vaultwarden-ha.loadbalancer.server.url=http://<REDACTED_HOST>:7277"

      - "traefik.http.routers.vaultwarden-ha-ws.entrypoints=websecure"
      - "traefik.http.routers.vaultwarden-ha-ws.rule=Host(`vault.${DOMAIN_NAME}`) && Path(`/notifications/hub`)"
      - "traefik.http.routers.vaultwarden-ha-ws.service=vaultwarden-ha-ws"
      - "traefik.http.routers.vaultwarden-ha-ws.priority=100"
      - "traefik.http.routers.vaultwarden-ha-ws.tls.certresolver=${CERTRESOLVER:-cloudflare}"
      - "traefik.http.services.vaultwarden-ha-ws.loadbalancer.server.url=http://<REDACTED_HOST>:3012"


    networks:
      - toolsproxy
      - homeproxy
      - gitproxy
      - authnet

    ports:
      - 80:80
      - 443:443
      - 8022:8022

    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /srv/traefik:/etc/traefik

    restart: unless-stopped
