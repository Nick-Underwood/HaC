services:
  prowlarr:
    image: git.u-acres.com/nicholas/linuxserver/prowlarr:latest
    container_name: prowlarr
    restart: unless-stopped
    networks:
      - mediaproxy
    environment:
      - PUID=${PUID:-568}
      - PGID=${PGID:-568}
      - TZ=${TZ:-America/Chicago}
    labels:
      - traefik.enable=true
      - traefik.http.routers.prowlarr.entrypoints=websecure
      - traefik.http.routers.prowlarr.rule=Host(`prowlarr.${DOMAIN_NAME}`)
      - traefik.http.routers.prowlarr.service=prowlarr
      - traefik.http.services.prowlarr.loadbalancer.server.port=9696
      - traefik.http.routers.prowlarr.tls.certresolver=${CERTRESOLVER:-cloudflare}
      - traefik.http.routers.prowlarr.tls.domains[0].main=prowlarr.${DOMAIN_NAME}
    volumes:
      - /srv/prowlarr/config:/config

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9696/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    mem_limit: 1g
    mem_reservation: 256m
    cpus: 2.0
    pids_limit: 200
networks:
  mediaproxy:
    external: true
