networks:
  toolsproxy:
    external: true

services:
  actualbudget:
    # Official Actual Budget server (actual-server). Serves the web app on 5006.
    # Pinned to latest stable release; bump deliberately, not by drift.
    image: git.u-acres.com/nicholas/actualbudget/actual-server:26.8.1
    container_name: actualbudget
    restart: unless-stopped

    # Resource limits (Node.js server)
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        reservations:
          memory: 128M
          cpus: '0.1'

    volumes:
      # Budget data persists on the host (server-files/ + user-files/ subfolders)
      - /srv/actualbudget:/data

    labels:
      # Traefik routing
      - traefik.enable=true
      - traefik.http.routers.actualbudget.entrypoints=websecure
      - traefik.http.routers.actualbudget.rule=Host(`budget.${DOMAIN_NAME}`)
      - traefik.http.routers.actualbudget.service=actualbudget
      - traefik.http.services.actualbudget.loadbalancer.server.port=5006
      - traefik.http.routers.actualbudget.tls.certresolver=${CERTRESOLVER}
      # Auth — native OIDC via Authentik (Actual handles SSO itself); LAN-only at the edge
      - traefik.http.routers.actualbudget.middlewares=lan-only@docker

    healthcheck:
      # Official health check shipped in the actual-server image
      test: ["CMD-SHELL", "node scripts/health-check.js"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s

    networks:
      - toolsproxy
