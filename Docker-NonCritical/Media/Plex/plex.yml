services:
  plex:
    image: git.u-acres.com/nicholas/linuxserver/plex:latest
    container_name: plex
    restart: unless-stopped
    networks:
      - mediaproxy
    environment:
      - PUID=${PUID:-568}
      - PGID=${PGID:-568}
      - TZ=${TZ:-America/Chicago}
      - VERSION=docker
      - PLEX_CLAIM=${PLEX_CLAIM}
      - TMPDIR=/transcode
      - ADVERTISE_IP=https://plex.${DOMAIN_NAME}/
    labels:
      - traefik.enable=true
      - traefik.http.routers.plex.entrypoints=websecure
      - traefik.http.routers.plex.rule=Host(`plex.${DOMAIN_NAME}`)
      - traefik.http.routers.plex.service=plex
      - traefik.http.routers.plex.tls=true
      - traefik.http.routers.plex.tls.certresolver=${CERTRESOLVER:-cloudflare}
      - traefik.http.routers.plex.tls.domains[0].main=plex.${DOMAIN_NAME}
      - traefik.http.services.plex.loadbalancer.server.port=32400
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128
    volumes:
      - /srv/plex/config:/config
      - /mnt/data/media/movies:/movies
      - /mnt/data/media/tv:/tv
      - /mnt/data/media/music:/music
      - /dev/shm:/transcode
    ports:
      - "32400:32400/tcp"
      - "3005:3005/tcp"
      - "8324:8324/tcp"
      - "32469:32469/tcp"
      - "1900:1900/udp"
      - "32410:32410/udp"
      - "32412:32412/udp"
      - "32413:32413/udp"
      - "32414:32414/udp"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:32400/web/index.html"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

    mem_limit: 4g
    mem_reservation: 1g
    cpus: 4.0
    pids_limit: 200
networks:
  mediaproxy:
    external: true
