name: Deploy Monitoring (NonCritical)

on:
  push:
    branches:
      - main
    paths:
      - "Docker-NonCritical/Management/Monitoring/**"
      - ".forgejo/workflows/deploy-monitoring.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: docker-noncritical
    defaults:
      run:
        shell: sh

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.FORGEJO_TOKEN }}
          ref: main

      - name: Authenticate to local registry
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
        run: |
          echo "$FORGEJO_TOKEN" | docker login git.u-acres.com -u nicholas --password-stdin
      - name: Verify compose file exists
        run: ls -l "./Docker-NonCritical/Management/Monitoring/monitoring.yml"

      # DURABLE DEPLOY: the act-runner checkout lives in an ephemeral
      # /tmp/act-runner/... dir that is purged between runs. Binding compose
      # volumes to that path is fatal — every service with a repo-relative
      # bind mount (prometheus, grafana, the exporters) dies on the next
      # workspace purge with exit 127 / "no such file or directory".
      # Sync everything to a PERSISTENT host dir (/srv/monitoring) first so
      # the bind mounts survive runner restarts. Mirrors the HaC convention:
      # deploy to persistent /srv/<svc>/, not the ephemeral checkout.
      - name: Sync compose + build contexts to persistent /srv/monitoring
        run: |
          set -x
          SRC="./Docker-NonCritical/Management/Monitoring"
          DST="/srv/monitoring"
          rm -rf "$DST"
          mkdir -p "$DST"
          # Copy config, prometheus, grafana provisioning/dashboards, and
          # exporter build contexts. Secrets are written separately below.
          cp -a "$SRC/monitoring.yml" "$DST/"
          cp -a "$SRC/prometheus"      "$DST/"
          cp -a "$SRC/grafana"         "$DST/"
          cp -a "$SRC/alertmanager"    "$DST/"
          cp -a "$SRC/ha_exporter"     "$DST/"
          cp -a "$SRC/opnsense_exporter" "$DST/"
          ls -la "$DST"

      - name: Write secrets from Forgejo repo secrets
        working-directory: "/srv/monitoring"
        env:
          S_GRAFANA: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
          S_OPN_KEY: ${{ secrets.OPNSENSE_API_KEY }}
          S_OPN_SEC: ${{ secrets.OPNSENSE_API_SECRET }}
          S_HA: ${{ secrets.HA_LONG_LIVED_TOKEN }}
          S_NTFY_USER: ${{ secrets.NTFY_ALERT_USER }}
          S_NTFY_PASS: ${{ secrets.NTFY_ALERT_PASSWORD }}
        run: |
          mkdir -p ./secrets
          printf '%s' "$S_GRAFANA" > ./secrets/grafana_admin_password
          printf '%s' "$S_OPN_KEY" > ./secrets/opnsense_api_key
          printf '%s' "$S_OPN_SEC"  > ./secrets/opnsense_api_secret
          printf '%s' "$S_HA"       > ./secrets/ha_token
          printf '%s' "$S_NTFY_USER" > ./secrets/ntfy_alert_user
          printf '%s' "$S_NTFY_PASS" > ./secrets/ntfy_alert_password
          echo "wrote $(ls -1 ./secrets | wc -l) secret files"

      - name: Deploy Monitoring from persistent /srv/monitoring
        working-directory: "/srv/monitoring"
        env:
          TZ: ${{ vars.TZ }}
        run: |
          set -x
          docker compose -p monitoring -f monitoring.yml down --remove-orphans || true
          docker compose -p monitoring -f monitoring.yml up -d --build

      - name: Wait for services to stabilize
        run: sleep 15

      - name: Verify endpoints
        run: |
          PM=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:9090/-/ready || true)
          echo "prometheus /-/ready: $PM"
          GF=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3001/api/health || true)
          echo "grafana /api/health: $GF"
          AM=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:9093/-/ready || true)
          echo "alertmanager /-/ready: $AM"
          HA_UP=$(curl -s http://localhost:9197/metrics 2>/dev/null | grep -c '^ha_up' || true)
          OPN_UP=$(curl -s http://localhost:9196/metrics 2>/dev/null | grep -c '^opnsense_up' || true)
          echo "ha_up metric lines: $HA_UP"
          echo "opnsense_up metric lines: $OPN_UP"
