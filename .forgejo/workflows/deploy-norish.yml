name: Deploy Norish

on:
  push:
    branches:
      - main
    paths:
      - "Docker-Critical/Home/Cooking/**"
      - ".forgejo/workflows/deploy-norish.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: <REDACTED_HOST>

    defaults:
      run:
        shell: sh

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Norish compose file exists
        shell: sh
        run: |
          ls -l "./Docker-Critical/Home/Cooking/norish.yml"

      - name: Authenticate to local registry
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
        run: |
          echo "$FORGEJO_TOKEN" | docker login <REDACTED_HOST> -u nicholas --password-stdin
      - name: Compare image and config
        shell: sh
        working-directory: "./Docker-Critical/Home/Cooking"
        env:
          CERTRESOLVER: ${{ vars.CERTRESOLVER }}
          DOMAIN_NAME: ${{ vars.DOMAIN_NAME }}
          NORISH_MASTER_KEY: ${{ secrets.NORISH_MASTER_KEY }}
          NORISH_OIDC_CLIENT_ID: ${{ vars.NORISH_OIDC_CLIENT_ID }}
          NORISH_OIDC_CLIENT_SECRET: ${{ secrets.NORISH_OIDC_CLIENT_SECRET }}
          NORISH_DB_PASSWORD: ${{ secrets.NORISH_DB_PASSWORD }}
          NORISH_REDIS_PASSWORD: ${{ secrets.NORISH_REDIS_PASSWORD }}
        run: |
          # --- credential resolution with host-file fallback -------------------
          # Forgejo Action secrets are the primary source. If a secret is missing
          # (e.g. NORISH_REDIS_PASSWORD not yet registered), fall back to the
          # persisted files on the deploy host so a deploy never fails open.
          [ -n "$NORISH_DB_PASSWORD" ]       || NORISH_DB_PASSWORD=$(sudo cat /srv/norish/secrets/db_password 2>/dev/null)
          [ -n "$NORISH_MASTER_KEY" ]        || NORISH_MASTER_KEY=$(sudo cat /srv/norish/secrets/master_key 2>/dev/null)
          [ -n "$NORISH_REDIS_PASSWORD" ]    || NORISH_REDIS_PASSWORD=$(sudo cat /srv/norish/redis_password 2>/dev/null)
          [ -n "$NORISH_OIDC_CLIENT_ID" ]    || NORISH_OIDC_CLIENT_ID=$(sudo sh -c '. /srv/norish/deploy.env 2>/dev/null; echo "$NORISH_OIDC_CLIENT_ID"')
          [ -n "$NORISH_OIDC_CLIENT_SECRET" ]|| NORISH_OIDC_CLIENT_SECRET=$(sudo sh -c '. /srv/norish/deploy.env 2>/dev/null; echo "$NORISH_OIDC_CLIENT_SECRET"')
          [ -n "$DOMAIN_NAME" ]              || DOMAIN_NAME=$(sudo sh -c '. /srv/norish/deploy.env 2>/dev/null; echo "$DOMAIN_NAME"')
          [ -n "$CERTRESOLVER" ]             || CERTRESOLVER=cloudflare
          [ -n "$NORISH_DB_USERNAME" ]       || NORISH_DB_USERNAME=postgres

          # Note: resolved values are persisted to /srv/norish/deploy.env by the
          # deploy step below, and read back as fallback on subsequent runs.

          # Extract defined image
          defined_image=$(grep -m1 'image:' norish.yml | awk '{print $2}')

          # Extract running image from remote host
          running_image=$(docker inspect -f '{{.Config.Image}}' norish-app 2>/dev/null || echo "none")

          # Compute checksum of compose file
          checksum=$(sha256sum norish.yml | awk '{print $1}')
          old=$(cat .norish_checksum 2>/dev/null || echo "")

          echo "Defined: $defined_image"
          echo "Running: $running_image"
          echo "Checksum: $checksum vs $old"

          if [ "$defined_image" != "$running_image" ] || [ "$checksum" != "$old" ]; then
            echo "Redeploying Norish..."

            # Copy compose file to local /srv
            sudo mkdir -p /srv/norish
            sudo cp norish.yml /srv/norish/
            sudo chmod 644 /srv/norish/norish.yml

            # VALIDATE config BEFORE touching any running container. This guards
            # against the previous incident where a missing required variable
            # (NORISH_REDIS_PASSWORD) made `compose config` fail AFTER `docker
            # rm -f`, leaving the stack torn down and unrecoverable by CI.
            if ! CERTRESOLVER=${CERTRESOLVER:-cloudflare} \
                 DOMAIN_NAME=$DOMAIN_NAME \
                 NORISH_MASTER_KEY=$NORISH_MASTER_KEY \
                 NORISH_OIDC_CLIENT_ID=$NORISH_OIDC_CLIENT_ID \
                 NORISH_OIDC_CLIENT_SECRET=$NORISH_OIDC_CLIENT_SECRET \
                 NORISH_DB_PASSWORD=$NORISH_DB_PASSWORD \
                 NORISH_DB_USERNAME=$NORISH_DB_USERNAME \
                 NORISH_REDIS_PASSWORD=$NORISH_REDIS_PASSWORD \
                 docker compose -p norish -f /srv/norish/norish.yml config >/dev/null; then
              echo "ERROR: compose config invalid - aborting WITHOUT touching running containers"
              exit 1
            fi

            # Deploy locally
            cd /srv/norish
            docker rm -f norish-app norish-db norish-redis chrome-headless || true
            docker compose -p norish -f norish.yml down --remove-orphans || true
            CERTRESOLVER=${CERTRESOLVER:-cloudflare} \
            DOMAIN_NAME=$DOMAIN_NAME \
            NORISH_MASTER_KEY=$NORISH_MASTER_KEY \
            NORISH_OIDC_CLIENT_ID=$NORISH_OIDC_CLIENT_ID \
            NORISH_OIDC_CLIENT_SECRET=$NORISH_OIDC_CLIENT_SECRET \
            NORISH_DB_PASSWORD=$NORISH_DB_PASSWORD \
            NORISH_DB_USERNAME=$NORISH_DB_USERNAME \
            NORISH_REDIS_PASSWORD=$NORISH_REDIS_PASSWORD \
            docker compose -p norish -f norish.yml up -d --force-recreate

            # Save checksum
            echo "$checksum" | sudo tee /srv/norish/.norish_checksum > /dev/null
          else
            echo "No changes detected; skipping redeploy"
          fi
