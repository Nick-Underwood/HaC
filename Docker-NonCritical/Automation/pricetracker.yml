version: '3.8'

services:
  pricetracker:
    image: <REDACTED_HOST>/nicholas/cybrarist/discount-bandit:v4
    container_name: pricetracker
    ports:
      - "8080:80"
    volumes:
      - ./database/database.sqlite:/app/database/sqlite
      - ./logs:/logs
    environment:
      - DB_CONNECTION=sqlite
      - APP_TIMEZONE=UTC
      - THEME_COLOR=Red
      - APP_URL=https://pricetracker.${DOMAIN_NAME}
      - ASSET_URL=https://pricetracker.${DOMAIN_NAME}
      - EXCHANGE_RATE_API_KEY=""
    restart: unless-stopped
    networks:
      - toolsproxy
networks:
  toolsproxy:
    external: true