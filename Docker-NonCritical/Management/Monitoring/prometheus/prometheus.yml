global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    monitor: u-acres

# Alerting: ship fired alerts to Alertmanager (on the toolsproxy network).
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - /etc/prometheus/alerting_rules.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: opnsense
    metrics_path: /metrics
    static_configs:
      - targets: ['opnsense_exporter:9196']
        labels:
          site: u-acres
          router: opnsense

  - job_name: homeassistant
    metrics_path: /metrics
    static_configs:
      - targets: ['ha_exporter:9197']
        labels:
          site: u-acres
          source: home-assistant

  # Docker host metrics (cAdvisor = per-container, node-exporter = host).
  # Scraped from each docker host over the LAN. DOCKER_HOST label set by the
  # exporter compose so series are attributed to the right node.
  - job_name: cadvisor
    metrics_path: /metrics
    static_configs:
      - targets:
          - '<REDACTED_IP>:18080'  # <REDACTED_HOST> <REDACTED_HOST> — 8080 taken by Traefik
          - '<REDACTED_IP>:18080'  # <REDACTED_HOST> <REDACTED_HOST> — 8080 taken by Traefik
        labels:
          site: u-acres
          source: docker

  - job_name: node-exporter
    metrics_path: /metrics
    static_configs:
      - targets:
          - '<REDACTED_IP>:9100'   # <REDACTED_HOST> <REDACTED_HOST>
          - '<REDACTED_IP>:9100'   # <REDACTED_HOST> <REDACTED_HOST>
        labels:
          site: u-acres
          source: docker-host
