services:
  hawser:
    image: <REDACTED_HOST>/nicholas/finsys/hawser:latest
    container_name: hawser
    restart: unless-stopped
    ports:
      - "2376:2376"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - hawser_stacks:/data/stacks
    environment:
      - AGENT_NAME=hac-noncritical
      - STACKS_DIR=/data/stacks
      - TZ=${TZ}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:2376/_hawser/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  hawser_stacks:
