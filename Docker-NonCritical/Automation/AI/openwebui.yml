networks:
  aiproxy:
    external: true

services:
  open-webui:
    image: <REDACTED_HOST>/nicholas/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped

    environment:
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-https://ollama.${DOMAIN_NAME}}
      - WEBUI_AUTH=true
      - ENABLE_SIGNUP=false
      - DEFAULT_MODELS=${OPENWEBUI_DEFAULT_MODELS:-qwen2.5-coder:14b,deepseek-chat}
      - ENABLE_OLLAMA_API=true
      - ENABLE_OPENAI_API=true
      - OPENAI_API_BASE_URL=${OPENWEBUI_OPENAI_API_BASE_URL:-https://api.deepseek.com/v1}
      - OPENAI_API_BASE_URLS=${OPENWEBUI_OPENAI_API_BASE_URL:-https://api.deepseek.com/v1}
      - OPENAI_API_KEY=${OPENWEBUI_DEEPSEEK_API_KEY}
      - OPENAI_API_KEYS=${OPENWEBUI_DEEPSEEK_API_KEY}
      - ENABLE_RAG_WEB_SEARCH=false
      - ENABLE_WEB_SEARCH=false
      - RAG_OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-https://ollama.${DOMAIN_NAME}}
      - RAG_EMBEDDING_ENGINE=ollama
      - RAG_EMBEDDING_MODEL=${OPENWEBUI_RAG_EMBEDDING_MODEL:-nomic-embed-text}
      - ENABLE_RAG_HYBRID_SEARCH=true
      - RAG_TOP_K=5
      - CHUNK_SIZE=1200
      - CHUNK_OVERLAP=120
      - ENABLE_OAUTH_SIGNUP=true
      - OAUTH_MERGE_ACCOUNTS_BY_EMAIL=true
      - OAUTH_CLIENT_ID=${OPENWEBUI_OAUTH_CLIENT_ID}
      - OAUTH_CLIENT_SECRET=${OPENWEBUI_OAUTH_CLIENT_SECRET}
      - OPENID_PROVIDER_URL=https://authentik.${DOMAIN_NAME}/application/o/open-webui/.well-known/openid-configuration
      - OAUTH_PROVIDER_NAME=Authentik
      - OAUTH_SCOPES=openid email profile

    volumes:
      - /srv/openwebui_data:/app/backend/data

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    mem_limit: 4g
    mem_reservation: 1g
    cpus: 4.0
    pids_limit: 200
    networks:
      - aiproxy

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.openwebui.entrypoints=websecure"
      - "traefik.http.routers.openwebui.rule=Host(`chat.${DOMAIN_NAME}`)"
      - "traefik.http.routers.openwebui.service=openwebui"
      - "traefik.http.services.openwebui.loadbalancer.server.port=8080"
      - "traefik.http.routers.openwebui.tls.certresolver=${CERTRESOLVER:-cloudflare}"
      - "traefik.http.routers.openwebui.tls.domains[0].main=chat.${DOMAIN_NAME}"

volumes:
  openwebui_data:
    name: openwebui_data
