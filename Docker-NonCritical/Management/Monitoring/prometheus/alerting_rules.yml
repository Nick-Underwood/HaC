# Alerting rules for the u-acres monitoring stack.
# Evaluation runs every global evaluation_interval (30s).
# These catch the exact failure modes that took the stack down silently:
#   - a scrape target going down (exporter crash, network split, host down)
#   - Prometheus itself unable to write to its TSDB
groups:
  - name: monitoring-health
    rules:
      # Any scrape target down for > 2min. Covers prometheus, opnsense,
      # homeassistant, cadvisor, node-exporter, and any future target.
      - alert: ScrapeTargetDown
        expr: up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Scrape target {{ $labels.instance }} ({{ $labels.job }}) is DOWN"
          description: "Prometheus has not been able to scrape {{ $labels.instance }} for >2m. Check the exporter/container and network reachability on toolsproxy."

      # Prometheus TSDB write failures — disk full or corruption.
      - alert: PrometheusTSDBWriteFailing
        expr: increase(prometheus_tsdb_compactions_failed_total[15m]) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Prometheus TSDB write/compaction failing"
          description: "TSDB compaction failures detected on {{ $labels.instance }}. Likely disk pressure or corruption — investigate /prometheus volume."

      # No targets scraped at all (Prometheus lost its config / all down).
      - alert: NoScrapeTargetsUp
        expr: count(up) == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Prometheus has zero healthy scrape targets"
          description: "No scrape targets are up. Prometheus may have lost its config or the whole LAN monitoring path is broken."

      # Node exporter (host) down — a docker host itself is unreachable.
      - alert: DockerHostDown
        expr: up{job="node-exporter"} == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Docker host {{ $labels.instance }} node-exporter DOWN"
          description: "node-exporter on {{ $labels.instance }} has been down >5m. The host may be offline or the exporter container stopped."
